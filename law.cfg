# law configuration of the HH4b SPANet pipeline.
#
# Nothing in here is mandatory: every path falls back to an environment
# variable and then to a generic default derived from $USER, so the file works
# as it is for every user.  Uncomment and edit an option to pin it.
#
# Use it with:   source setup_law.sh   (inside the SPANet virtual environment)

[modules]
law_tasks.tasks

[logging]
law: INFO


[hh4b_spanet]

# --- directories ----------------------------------------------------------
# Directory holding the SPANet and HH4b_SPANet checkouts.
# fallback: $SPANET_MAIN_DIR, then the parent of this repository
; spanet_main_dir: /afs/cern.ch/user/x/xyz

# Python virtual environment used for every command (e.g. spanet_env_test_eos).
# fallback: $SPANET_ENV_DIR, then $VIRTUAL_ENV
; spanet_env_dir: /eos/user/x/xyz/spanet_infos/spanet_env_test_eos

# Base of all outputs; the other directories below default to subdirectories.
# fallback: $SPANET_EOS_BASE, then /eos/user/${USER:0:1}/$USER/spanet_infos
; eos_base: /eos/user/x/xyz/spanet_infos

# Directory in which 'out_spanet_outputs' is created.
# fallback: $EOS_SPANET, then <eos_base>/spanet_outputs
; output_base: /eos/user/x/xyz/spanet_infos/spanet_outputs

# Where the efficiency and ROC plots are written.
# fallback: $SPANET_EFF_PLOT_DIR / $SPANET_ROC_PLOT_DIR, then
# <eos_base>/spanet_eff_plots/vbf and <eos_base>/spanet_roc_curves
; eff_plot_base: /eos/user/x/xyz/spanet_infos/spanet_eff_plots/vbf
; roc_plot_base: /eos/user/x/xyz/spanet_infos/spanet_roc_curves

# Where the generated performance configurations are written.
# fallback: $SPANET_LAW_WORK_DIR, then <eos_base>/law_work
; work_dir: /eos/user/x/xyz/spanet_infos/law_work

# --- apptainer ------------------------------------------------------------
# fallback: $SPANET_APPTAINER_IMAGE, then the cmsml image on cvmfs
; apptainer_image: /cvmfs/unpacked.cern.ch/registry.hub.docker.com/cmsml/cmsml:latest

# Comma separated bind mounts.  By default /afs, /cvmfs, the EOS home of
# $USER and all directories configured above are bound; add the EOS area of a
# colleague here (or in $SPANET_APPTAINER_BINDS) to read shared samples.
; apptainer_binds: /afs, /cvmfs, /eos/user/m/mmalucch, /eos/user/x/xyz

# --- configurations to extend ---------------------------------------------
# The generated configurations import these, so all models that are active
# there are drawn next to the new one.
; eff_base_config: utils/performance/efficiency_configuration_vbf_ggf.py
; roc_base_config: utils/roccurves/roc_configuration_vbf_ggf.py

# --- naming conventions ---------------------------------------------------
# Prefix of the options basename that is stripped when deriving names, and the
# prefix that replaces it in the true_dict keys.
; model_prefix: hh4b_pairing_vbf_ggf_all_Klambda_
; true_key_prefix: 9jets_all_Klambda_

# Label construction: '<label_prefix> - <remaining tokens>' with <label_strip>
# removed, the replacements applied and ' Train' appended to the tokens listed.
; label_prefix: VBF pair+clas
; label_strip: VBFPairing_
; label_replacements: {"DNNVars": "DNN Vars"}
; label_train_tokens: VBFNoKinCut, VBFPresel

# Regular expressions of tokens that describe the training only and therefore
# do not enter the name of the truth entry.
; training_only_tokens: ClassLoss\d*, PtFlatten, \d+e

# Colors assigned to new models, in this order.
; palette: orange, blue, green, red, purple, magenta, dodgerblue, firebrick, teal, darkorange, lime, cyan, brown, gold, navy, black

# klambda entry of the generated true_dict entries
; klambda: postEE


# Efficiency plots produced by hh4b.EfficiencyPlots: the key is the
# subdirectory, the value the arguments passed to efficiency_studies.py.
[efficiency_plots]
VBFEff_vbf_no_kin_cuts: --vbf -c 1 -ih -r vbf_no_kin_cuts -k
VBFEff_vbf_presel: --vbf -c 1 -ih -r vbf_presel -k
HiggsEff: -c 0 -k


# ROC plots produced by hh4b.RocPlots, passed to ROC_plots.py.
[roc_plots]
vbf_no_kin_cuts: -r vbf_no_kin_cuts -klb 1 all -s 0.8
vbf_presel: -r vbf_presel -klb 1 all -s 0.8


# Entries added to the generated configurations when the token appears in the
# options basename.  Keys are '<token>.spanet' and '<token>.true'.
[model_extras]
JetVBFHiggs.spanet: {"jet_coll": "JetVBF", "n_higgs_jets": 0, "offset_jet_idx": -4}
JetVBFHiggs.true: {"jet_coll_higgs": "JetVBF", "n_higgs_jets": 0}
