# ---------------------------------------------------
# REQUIRED - INPUTS - List all inputs to SPANet here.
# ---------------------------------------------------
INPUTS:
  # -----------------------------------------------------------------------------
  # REQUIRED - SEQUENTIAL - inputs which can have an arbitrary number of vectors.
  # -----------------------------------------------------------------------------
  SEQUENTIAL:
    Jet:
      # MASK: normalize
      eta: normalize
      mass: log_normalize
      phi: normalize
      pt: log_normalize


  # ---------------------------------------------------------------------
  # REQUIRED - GLOBAL - inputs which will have a single vector per event.
  # ---------------------------------------------------------------------
  GLOBAL:
    Event:
      HT: log_normalize
      dR_max: normalize
      dR_min: normalize
      sigma_over_higgs1_reco_mass: normalize
      sigma_over_higgs2_reco_mass: normalize
      mjjJetTotalSPANetPadded: log_normalize
      detaJetTotalSPANetPadded: normalize
      centralityHiggsLeadingJetTotalSPANetPadded: normalize
      centralityHiggsSubLeadingJetTotalSPANetPadded: normalize
    HiggsLeading:
      dR: normalize
      dEta: normalize
      eta: normalize
      helicityCosTheta: normalize
      mass: log_normalize
      phi: normalize
      pt: log_normalize
    HiggsSubLeading:
      dR: normalize
      dEta: normalize
      eta: normalize
      helicityCosTheta: normalize
      mass: log_normalize
      phi: normalize
      pt: log_normalize
    HH:
      Costhetastar_CS: normalize
      dEta: normalize
      dR: normalize
      eta: normalize
      mass: log_normalize
      phi: normalize
      pt: log_normalize


# ----------------------------------------------------------------------
# REQUIRED - EVENT - Complete list of resonance particles and daughters.
# ----------------------------------------------------------------------
EVENT:
  h1:
    - b1: Jet
    - b2: Jet
  h2:
    - b1: Jet
    - b2: Jet


# ---------------------------------------------------------
# REQUIRED KEY - PERMUTATIONS - List of valid permutations.
# ---------------------------------------------------------
PERMUTATIONS:
    EVENT:
      - [ h1, h2 ]
    h1:
      - [ b1, b2 ]
    h2:
      - [ b1, b2 ]


# ------------------------------------------------------------------------------
# REQUIRED - REGRESSIONS - List of desired features to regress from observables.
# ------------------------------------------------------------------------------
REGRESSIONS:


# -----------------------------------------------------------------------------
# REQUIRED - REGRESSIONS - List of desired classes to predict from observables.
# -----------------------------------------------------------------------------
CLASSIFICATIONS:
  EVENT:
    - class
